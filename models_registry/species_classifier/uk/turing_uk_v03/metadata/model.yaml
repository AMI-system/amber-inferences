notes: >
  This is the current production UK species classifier used in the pipeline. It
  replaces earlier Aarhus models and is paired with the UK-specific category map.
  A second category map variant was observed in OneDrive but is not present in
  the working model directory and is not used in the pipeline.

  The AMBER inference pipeline can be run by specifying only the species model.
  In this case, upstream models (localisation, binary, order) are automatically
  loaded using default paths defined in the pipeline. These models are not
  embedded within the species model itself but are implicitly required.

