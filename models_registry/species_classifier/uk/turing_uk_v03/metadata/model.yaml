description: >
  Fine-grained species classification model for UK moth species using a ResNet50
  architecture. This is the primary species classifier used in the AMBER inference
  pipeline for UK deployments.

inputs:
  - cropped moth image

outputs:
  - top_n_species predictions
  - confidence scores

used_in_pipeline: true

pipeline_context:
